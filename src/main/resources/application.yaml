server:
  # Allow overriding server address via env var SERVER_ADDR (default 127.0.0.1:8080)
  address: ${SERVER_ADDR:127.0.0.1}
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: petstore

  # Virtual Threads — Java 21 feature for high concurrency with low memory overhead
  threads:
    virtual:
      enabled: true

  data:
    mongodb:
      authentication-database: admin
      database: petstore
      # Allow overriding MongoDB connection via env var DATABASE_URI with sensible default
      uri: ${DATABASE_URI:mongodb://root:example@localhost:27017/?authSource=admin}

  jackson:
    date-format: net.petstore.RFC3339DateFormat
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

  # Caffeine cache — high-performance in-memory caching
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=600s

# SpringDoc OpenAPI — replaces Springfox
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
