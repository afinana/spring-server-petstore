name: Docker

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  push:
    branches: [ main ]
    # Publish semver tags as releases.    
  pull_request:
    branches: [ main]

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: docker.io
  # github.repository as <account>/<repo>
  USER_ACCOUNT: ${{ secrets.DOCKERHUB_USERNAME }}
  USER_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
  IMAGE_NAME: spring-server-petstore
  TAG_NAME: redis



jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge  
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          buildkitd-flags: --debug

      # Login to registry for non-PR events
      - name: Log into registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.USER_ACCOUNT }}
          password: ${{ env.USER_PASSWORD }}

      # Extract metadata (tags, labels) for Docker images
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.USER_ACCOUNT }}/${{ env.IMAGE_NAME }}

      # Decide build args: skip tests by default; for SNAPSHOT builds, enable cache-bust
      - name: Prepare build args
        id: buildargs
        run: |
          echo "MAVEN_ARGS=-DskipTests" >> $GITHUB_OUTPUT
          if grep -q "-SNAPSHOT" pom.xml || grep -q "<version>.*SNAPSHOT.*</version>" pom.xml; then
            echo "Detected SNAPSHOT version in pom.xml"
            echo "CACHE_BUST=$(date +%s)" >> $GITHUB_OUTPUT
          else
            echo "CACHE_BUST=" >> $GITHUB_OUTPUT
          fi

      # Build and push Docker image (uses the repo's Dockerfile which performs the Maven build)
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          # Use explicit tag from TAG_NAME (e.g. 'mongo') so CI builds create
          # USER_ACCOUNT/IMAGE_NAME:TAG_NAME. Also include metadata-derived tags.
          tags: |-
            ${{ env.USER_ACCOUNT }}/${{ env.IMAGE_NAME }}:${{ env.TAG_NAME }}
            ${{ steps.meta.outputs.tags }}
          build-args: |
            MAVEN_ARGS=${{ steps.buildargs.outputs.MAVEN_ARGS }}
            CACHE_BUST=${{ steps.buildargs.outputs.CACHE_BUST }}
          labels: |-
            org.opencontainers.image.created=${{ steps.meta.outputs.date }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image details
        if: always()
        run: |
          echo "Image tags: ${{ steps.meta.outputs.tags }}"
